name: Update Daily Scripts

on:
  schedule:
    - cron: '0 10 * * *'  # Runs every day at 10:00 AM UTC
  workflow_dispatch:      # Allows you to run it manually for testing

jobs:
  build:
    runs-on: ubuntu-latest
    
    # This block fixes the 403 error by giving the script 'Write' access
    permissions:
      contents: write

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run script to fetch hot topics
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: python agent.py

      - name: Commit and Push the new scripts
        run: |
          git config --global user.name 'GitHub Action Bot'
          git config --global user.email 'action@github.com'
          git add shorts_scripts.md
          # The '|| exit 0' prevents the action from failing if there are no news changes
          git commit -m "Automated update: New YouTube Shorts scripts" || exit 0
          git push
